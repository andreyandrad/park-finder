<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs de Registros</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header>
        <a href="dashboard.html" class="logo-container">
            <i class="fas fa-car"></i>
            <h1>ParkFinder</h1>
        </a>
        <nav class="header-nav">
            <a href="dashboard.html" class="nav-link">Voltar ao Dashboard</a>
            <div class="user-menu">
                <span id="username-display">Carregando...</span>
                <button class="btn-logout" id="btn-logout">Sair</button>
            </div>
        </nav>
    </header>

    <main>
        <h2>Logs do Sistema</h2>
        <table>
            <thead>
                <tr>
                    <th>Estacionamento</th>
                    <th>Vaga</th>
                    <th>Entrada</th>
                    <th>Saída</th>
                </tr>
            </thead>
            <tbody id="logs-table-body">
            </tbody>
        </table>

        <div id="empty-state" class="empty-state" style="display: none;">
            <i class="fas fa-history"></i>
            <h3>Nenhum log encontrado</h3>
            <p>Nenhuma movimentação foi registrada no sistema ainda.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 ParkFinder. Todos os direitos reservados.</p>
    </footer>

    <div id="modal-placeholder"></div>
    <div id="toast-container"></div>
    <script type="module" src="js/logs.js"></script>
</body>

</html>
