<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Estacionamento</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="dashboard.html" class="logo-container">
            <i class="fas fa-car"></i>
            <h1 id="header-nome-estacionamento">Carregando...</h1>
        </a>
        <nav class="header-nav">
            <a href="dashboard.html" class="nav-link">Voltar ao Dashboard</a>
            <div class="user-menu">
                <span id="username-display">Carregando...</span>
                <button class="btn-logout" id="btn-logout">Sair</button>
            </div>
        </nav>
    </header>

    <main>
        <div class="kpi-container" id="kpi-container">
            <div class="kpi-card">
                <h3>Total de Vagas</h3>
                <div class="kpi-value" id="kpi-total">0</div>
            </div>
            <div class="kpi-card">
                <h3>Vagas Livres</h3>
                <div class="kpi-value livre" id="kpi-livre">0</div>
            </div>
            <div class="kpi-card">
                <h3>Vagas Ocupadas</h3>
                <div class="kpi-value ocupada" id="kpi-ocupada">0</div>
            </div>
            <div class="kpi-card">
                <h3>Em Manutenção</h3>
                <div class="kpi-value manutencao" id="kpi-manutencao">0</div>
            </div>
        </div>

        <div class="controles-patio">
            <h2>Mapa de Vagas</h2>
            <button id="btn-simulador" class="btn-simulador inativo">
                <i class="fas fa-play"></i> Iniciar Simulação
            </button>
        </div>

        <div class="filter-container" id="filter-container">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="livre">Livres</button>
            <button class="filter-btn" data-filter="ocupada">Ocupadas</button>
            <button class="filter-btn" data-filter="carro">Carros</button>
            <button class="filter-btn" data-filter="moto">Motos</button>
            <button class="filter-btn" data-filter="pcd">PCD</button>
        </div>

        <div id="loading-message">Carregando vagas...</div>
        <div id="mapa-container">
        </div>

        <div class="legenda">
            <span class="cor-legenda livre"></span> Livre
            <span class="cor-legenda ocupada"></span> Ocupada
            <span class="cor-legenda pcd"></span> PCD (Deficiente)
            <span class="cor-legenda moto"></span> Moto
            <span class="cor-legenda manutencao"></span> Manutenção
        </div>
    </main>

    <footer>
        <p>&copy; 2025 ParkFinder. Todos os direitos reservados.</p>
    </footer>

    <div id="modal-placeholder"></div>
    <div id="toast-container"></div>
    <script type="module" src="js/main.js" defer></script>
</body>

</html>
