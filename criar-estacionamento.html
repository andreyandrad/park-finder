<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Estacionamento</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header>
        <a href="dashboard.html" class="logo-container">
            <i class="fas fa-car"></i>
            <h1>Estacionamento PRO</h1>
        </a>
        <nav class="header-nav">
            <a href="dashboard.html" class="nav-link">Voltar ao Dashboard</a>
            <div class="user-menu">
                <span id="username-display">Carregando...</span>
                <button class="btn-logout" id="btn-logout">Sair</button>
            </div>
        </nav>
    </header>

    <main>
        <h2>Criar Novo Estacionamento</h2>
        <div class="form-container">
            <form id="form-criar-estacionamento">
                <div class="form-group">
                    <label for="nome">Nome do Estacionamento (Ex: Shopping Plaza)</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="form-group">
                    <label for="endereco">Endereço (Opcional)</label>
                    <input type="text" id="endereco">
                </div>
                <h3>Definir Vagas Iniciais</h3>
                <div class="form-group">
                    <label for="qtd_carro">Quantidade de Vagas de Carro</label>
                    <input type="number" id="qtd_carro" value="0" min="0" required>
                </div>
                <div class="form-group">
                    <label for="qtd_moto">Quantidade de Vagas de Moto</label>
                    <input type="number" id="qtd_moto" value="0" min="0" required>
                </div>
                <div class="form-group">
                    <label for="qtd_pcd">Quantidade de Vagas PCD</label>
                    <input type="number" id="qtd_pcd" value="0" min="0" required>
                </div>
                <button type="submit" class="btn-submit">Criar Estacionamento</button>
                <div id="form-feedback"></div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Estacionamento PRO. Todos os direitos reservados.</p>
    </footer>

    <div id="toast-container"></div>
    <script type="module" src="js/criar.js"></script>
</body>

</html>
