<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Estacionamento</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header>
        <h1><span class="fas fa-plus"></span> Novo Estacionamento</h1>
        <a href="dashboard.html">Voltar</a>
    </header>
    <main>
        <div class="form-container">
            <form id="form-criar-estacionamento">
                <div class="form-group">
                    <label for="nome">Nome do Estacionamento (Ex: Shopping Plaza)</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="form-group">
                    <label for="endereco">Endereço (Opcional)</label>
                    <input type="text" id="endereco">
                </div>
                <h3>Definir Vagas</h3>
                <div class="form-group">
                    <label for="qtd_carro">Quantidade de Vagas de Carro</label>
                    <input type="number" id="qtd_carro" value="0" min="0" required>
                </div>
                <div class="form-group">
                    <label for="qtd_moto">Quantidade de Vagas de Moto</label>
                    <input type="number" id="qtd_moto" value="0" min="0" required>
                </div>
                <div class="form-group">
                    <label for="qtd_pcd">Quantidade de Vagas PCD</label>
                    <input type="number" id="qtd_pcd" value="0" min="0" required>
                </div>
                <button type="submit" class="btn-submit">Criar Estacionamento</button>
                <div id="form-feedback"></div>
            </form>
        </div>
    </main>
    <div id="toast-container"></div>
    <script type="module" src="js/criar.js"></script>
</body>

</html>
